<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>목표달성 인증 스터디</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
:root{
  --bg:#0d0f1a;--s1:#141726;--s2:#1c2035;--border:#2a2f4a;
  --accent:#00e5a0;--accent2:#4d96ff;--accent3:#ffd93d;
  --danger:#ff6b6b;--warn:#fbbf24;--text:#e8eaf0;--muted:#5a6080;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{position:sticky;top:0;z-index:100;background:rgba(13,15,26,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:.65rem 1rem;display:flex;align-items:center;justify-content:space-between}
.nav-title{font-size:.88rem;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:.4rem}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sync-dot{font-family:'DM Mono',monospace;font-size:.6rem;padding:.15rem .55rem;border-radius:100px;background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.2);color:var(--accent)}
.sync-dot.err{color:var(--danger);background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.2)}
.loading{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
.loading.hidden{opacity:0;pointer-events:none}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:.7rem}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted)}
.main{max-width:680px;margin:0 auto;padding:1rem .85rem}
.member-chips{display:flex;gap:.6rem;margin-bottom:1.2rem;flex-wrap:wrap}
.member-chip{display:flex;align-items:center;gap:.45rem;padding:.55rem 1.1rem;background:var(--s1);border:1.5px solid var(--border);border-radius:12px;cursor:pointer;font-size:.88rem;font-weight:600;transition:all .15s;user-select:none}
.member-chip:hover{border-color:var(--accent);background:rgba(0,229,160,.06);transform:translateY(-1px)}
.member-chip:active{transform:translateY(0)}
.member-emoji{font-size:1.15rem;line-height:1}
.cal-section{margin-bottom:1.5rem}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.cal-title{font-size:.92rem;font-weight:600;color:var(--text)}
.cal-nav{display:flex;align-items:center;gap:.4rem}
.cal-nav-btn{background:var(--s1);border:1px solid var(--border);color:var(--text);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .15s}
.cal-nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.dow{text-align:center;font-size:.6rem;font-family:'DM Mono',monospace;color:var(--muted);padding:2px 0}
.dow.sun{color:rgba(255,107,107,.7)}.dow.sat{color:rgba(77,150,255,.7)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:.3rem .2rem .35rem;display:flex;flex-direction:column;gap:2px;min-height:70px;overflow:hidden;min-width:0}
.cal-cell.empty{background:transparent;border-color:transparent;pointer-events:none}
.cal-cell.today{border-color:var(--accent)}
.cal-cell.today .day-num{color:var(--accent)}
.cal-cell.sun .day-num{color:#ff6b6b}
.cal-cell.sat .day-num{color:#4d96ff}
.cal-cell.holiday-day .day-num{color:#ff6b6b}
.day-top{display:flex;align-items:center;justify-content:space-between;gap:2px;min-width:0}
.day-num{font-size:.78rem;font-weight:700;line-height:1;flex-shrink:0}
.day-hol{font-size:.38rem;color:rgba(255,107,107,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right;line-height:1}
.cal-members{display:flex;flex-direction:column;gap:2px;margin-top:1px}
.cal-mem-row{display:flex;align-items:center;gap:2px;border-radius:5px;padding:1px 2px}
.cal-mem-emoji{font-size:.82rem;line-height:1;flex-shrink:0}
.cal-mem-stat{font-family:'DM Mono',monospace;font-size:.65rem;font-weight:700;flex-shrink:0;white-space:nowrap;line-height:1}
.s-done{color:var(--accent)}
.s-part{color:var(--warn)}
.s-none{color:var(--muted);opacity:.5}
.s-rest{color:#4d96ff;font-size:.55rem;background:rgba(77,150,255,.12);border-radius:3px;padding:0 3px}
.s-spec{color:#a855f7;font-size:.55rem;background:rgba(168,85,247,.12);border-radius:3px;padding:0 3px}
.plan-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:300;align-items:flex-end;justify-content:center}
.plan-overlay.show{display:flex}
.plan-sheet{background:#0e1320;border:1px solid rgba(245,200,30,.3);border-radius:20px 20px 0 0;width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;animation:su .22s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.plan-hdr{padding:1rem 1rem .8rem;border-bottom:1px solid var(--border);flex-shrink:0}
.plan-hdr-top{display:flex;align-items:center;justify-content:space-between}
.plan-mem-lbl{display:flex;align-items:center;gap:.45rem;font-size:.82rem;font-weight:700;color:#ffd93d}
.plan-body{flex:1;overflow-y:auto;padding:.9rem 1rem 2rem;display:flex;flex-direction:column;gap:.75rem}
.plan-icon-btn{background:rgba(245,200,30,.1);border:1px solid rgba(245,200,30,.3);color:#ffd93d;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:.82rem;display:flex;align-items:center;justify-content:center}
.plan-close{background:none;border:none;color:var(--muted);font-size:1.25rem;cursor:pointer;padding:0;line-height:1}
.rest-btns{display:flex;gap:.4rem;margin-bottom:6px}
.rest-btn{flex:1;border-radius:8px;padding:7px 0;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border:1px solid var(--border);background:var(--s2);color:var(--muted);transition:all .15s}
.rest-usage{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted)}
.plan-item-row{display:flex;align-items:center;gap:6px;border-radius:7px;padding:5px 8px;touch-action:none;user-select:none;cursor:grab}
.plan-chk{width:18px;height:18px;border-radius:50%;border:2px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.6rem}
.plan-fail-btn,.plan-del-btn{background:none;border:1.5px solid;border-radius:50%;width:18px;height:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;flex-shrink:0}
.plan-edit-btn{background:none;border:1.5px solid var(--muted);border-radius:50%;width:18px;height:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0;color:var(--muted);opacity:.6}
.plan-add-row{display:flex;gap:.35rem}
.plan-add-inp{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.82rem;padding:6px 9px;outline:none;font-family:'Noto Sans KR',sans-serif}
.plan-add-inp:focus{border-color:#ffd93d}
.plan-add-btn{background:rgba(245,200,30,.15);border:1px solid rgba(245,200,30,.4);color:#ffd93d;border-radius:7px;padding:0 14px;cursor:pointer;font-size:1.1rem;font-weight:700}
.clover-box{background:var(--s2);border-radius:10px;padding:12px 14px;text-align:center}
.clover-row{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:8px}
.clover-stat{font-family:'DM Mono',monospace;font-size:1rem;font-weight:700;color:#ffd93d}
.fine-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

.plan-item-text{font-size:.82rem}
/* 반응형 글자 크기 */
@media(min-width:400px){
  .plan-item-text{font-size:.88rem}
  .plan-add-inp{font-size:.88rem}
}
@media(min-width:600px){
  .plan-item-text{font-size:1rem}
  .plan-add-inp{font-size:1rem}
  .plan-mem-lbl{font-size:.95rem}
  .plan-hdr .plan-date-lbl{font-size:1.15rem}
  .rest-btn{font-size:.88rem;padding:9px 0}
  .clover-stat{font-size:1.1rem}
  .clover-row span{font-size:2.4rem!important}
}
@media(min-width:768px){
  .plan-item-text{font-size:1.1rem}
  .plan-add-inp{font-size:1.05rem}
  .plan-mem-lbl{font-size:1rem}
  .clover-stat{font-size:1.2rem}
  .clover-row span{font-size:2.8rem!important}
  .rest-btn{font-size:.92rem;padding:10px 0}
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="load-txt">불러오는 중...</div>
</div>

<nav class="nav">
  <div class="nav-title">
    <span class="nav-dot"></span>
    목표달성 인증 스터디
  </div>
  <span class="sync-dot" id="syncDot">● 연결 중</span>
</nav>

<!-- 날짜 클릭 멤버 선택 -->
<div class="plan-overlay" id="dayPicker" onclick="if(event.target===this)window.closeDayPicker()">
  <div class="plan-sheet" style="max-height:60vh">
    <div class="plan-hdr">
      <div class="plan-hdr-top">
        <div id="dayPickerTitle" class="plan-mem-lbl" style="font-size:1rem"></div>
        <button class="plan-close" onclick="window.closeDayPicker()">✕</button>
      </div>
    </div>
    <div class="plan-body" style="gap:.5rem" id="dayPickerMembers"></div>
  </div>
</div>

<div class="plan-overlay" id="planOverlay" onclick="if(event.target===this)window.closePlan()">
  <div class="plan-sheet" id="planCard">
    <div class="plan-hdr">
      <div class="plan-hdr-top">
        <div class="plan-mem-lbl" id="planMemLbl"></div>
        <div style="display:flex;align-items:center;gap:.4rem">
          <button class="plan-icon-btn" onclick="window.capturePlan()">📷</button>
          <button class="plan-close" onclick="window.closePlan()">✕</button>
        </div>
      </div>
      <div style="font-size:1.05rem;font-weight:700;margin-top:3px" id="planDateLbl"></div>
    </div>
    <div class="plan-body" id="planBody"></div>
  </div>
</div>

<div class="main">
  <div class="member-chips" id="memberChips"></div>
  <!-- 멤버 추가 폼 -->
  <div id="addMemberForm" style="display:none;align-items:center;gap:.5rem;margin-bottom:1rem;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:.6rem .8rem;flex-wrap:wrap">
    <input id="newEmoji" type="text" maxlength="2" placeholder="🌟" style="width:44px;background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:1.2rem;padding:4px;text-align:center;outline:none">
    <input id="newName" type="text" maxlength="10" placeholder="닉네임" style="flex:1;min-width:80px;background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.88rem;padding:5px 9px;outline:none;font-family:inherit" onkeydown="if(event.key==='Enter')window.submitAddMember()">
    <button onclick="window.submitAddMember()" style="background:rgba(0,229,160,.15);border:1px solid rgba(0,229,160,.4);color:#00e5a0;border-radius:7px;padding:5px 14px;cursor:pointer;font-size:.88rem;font-weight:700;font-family:inherit">추가</button>
    <button onclick="document.getElementById('addMemberForm').style.display='none'" style="background:none;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:.88rem;font-family:inherit">취소</button>
  </div>
  <div class="cal-section">
    <div class="cal-header">
      <span class="cal-title" id="calTitle"></span>
      <div class="cal-nav">
        <button class="cal-nav-btn" id="prevBtn">‹</button>
        <button class="cal-nav-btn" id="nextBtn">›</button>
      </div>
    </div>
    <div class="dow-row">
      <div class="dow sun">일</div><div class="dow">월</div><div class="dow">화</div>
      <div class="dow">수</div><div class="dow">목</div><div class="dow">금</div><div class="dow sat">토</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const FB={apiKey:"AIzaSyCz9dmLAFVdp_fe4bneN5wlW8bknyH3bgM",authDomain:"yeonwoo-d3721.firebaseapp.com",projectId:"yeonwoo-d3721",storageBucket:"yeonwoo-d3721.firebasestorage.app",messagingSenderId:"1021874423334",appId:"1:1021874423334:web:35e70b78c8e0d6c18788e7"};
const app=initializeApp(FB);
const db=getFirestore(app);

const MEMBERS=[
  {id:'karo',  name:'카로',  emoji:'🫒'},
  {id:'yeonwoo',name:'연우', emoji:'🍀'},
];
// localStorage에서 멤버 로드 (없으면 기본값)
function loadMembers(){
  try{
    const r=localStorage.getItem('mm_members');
    if(r){const p=JSON.parse(r);if(Array.isArray(p)&&p.length>0)return p;}
  }catch(e){}
  return[...MEMBERS];
}
function persistMembers(){
  try{localStorage.setItem('mm_members',JSON.stringify(members));}catch(e){}
}
let members=loadMembers();
const HOLIDAYS={"2026":{"0":{1:"신정"},"1":{16:"설날연휴",17:"설날",18:"설날연휴"},"2":{1:"삼일절"},"4":{5:"어린이날",25:"부처님오신날"},"5":{6:"현충일"},"7":{15:"광복절"},"8":{24:"추석연휴",25:"추석",26:"추석연휴"},"9":{3:"개천절",9:"한글날"},"11":{25:"크리스마스"}},"2025":{"0":{1:"신정"},"1":{28:"설날연휴",29:"설날",30:"설날연휴"},"2":{1:"삼일절"},"4":{5:"어린이날",6:"대체공휴일"},"5":{6:"현충일"},"7":{15:"광복절"},"9":{3:"개천절",5:"추석연휴",6:"추석",7:"추석연휴",8:"대체공휴일",9:"한글날"},"11":{25:"크리스마스"}}};
function getHol(y,m,d){return HOLIDAYS[String(y)]?.[String(m)]?.[d]||null;}

const PLAN_FINE=500, PLAN_TARGET=3;
const now=new Date();
let curYear=now.getFullYear(), curMonth=now.getMonth();
const todayY=now.getFullYear(),todayM=now.getMonth(),todayD=now.getDate();
let plansByMember={}, unsubPlans={}, openMemberId=null, planDateStr=todayStr();

function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dStr(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function pdocId(mid,y,m){return`plan_${mid}_${y}_${String(m+1).padStart(2,'0')}`;}
function genId(){return'p'+Date.now()+Math.floor(Math.random()*9999);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setSyncDot(ok){const el=document.getElementById('syncDot');el.textContent=ok?'● 실시간':'● 오류';el.classList.toggle('err',!ok);}

async function savePlan(mid,ds,data){
  if(!plansByMember[mid])plansByMember[mid]={};
  plansByMember[mid][ds]=data;
  await setDoc(doc(db,'miraclemorning',pdocId(mid,curYear,curMonth)),plansByMember[mid]);
}

function getPlan(mid,ds){return plansByMember[mid]?.[ds]||{items:[],isRest:false,isSpecialRest:false};}

function calcAch(mid,ds){
  const p=getPlan(mid,ds);
  if(p.isSpecialRest)return{type:'special'};
  if(p.isRest)return{type:'rest'};
  const total=p.items.length;
  if(!total)return{type:'empty'};
  return{type:'progress',achieved:p.items.filter(i=>i.done).length,total};
}

function calcPlanStatus(mid,ds){
  const p=getPlan(mid,ds);
  const wt=it=>Math.min(3,Math.max(1,it.weight||1));
  const total=p.items.reduce((s,it)=>s+wt(it),0);
  const achieved=p.items.filter(i=>i.done).reduce((s,it)=>s+wt(it),0);
  const failed=p.items.filter(i=>i.fail).reduce((s,it)=>s+wt(it),0);
  const isOff=p.isRest||p.isSpecialRest;
  return{total,achieved,failed,fine:isOff?0:Math.max(0,PLAN_TARGET-achieved)*PLAN_FINE,isOff,isRest:p.isRest,isSpecialRest:p.isSpecialRest};
}

function calcRestUsage(mid,ds){
  const[y,m]=ds.split('-').map(Number);
  const prefix=`${y}-${String(m).padStart(2,'0')}`;
  const mp=plansByMember[mid]||{};
  const keys=Object.keys(mp).filter(k=>k.startsWith(prefix));
  const d=new Date(ds),dow=d.getDay(),diffMon=dow===0?-6:1-dow;
  const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()+diffMon);
  const wk=Array.from({length:7},(_,i)=>{const x=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);return dStr(x.getFullYear(),x.getMonth(),x.getDate());});
  return{weekUsed:wk.filter(k=>mp[k]?.isRest).length,weekLimit:2,monthUsed:keys.filter(k=>mp[k]?.isSpecialRest).length,monthLimit:2};
}

// ── 날짜 클릭 → 멤버 선택 팝업 ─────────────────
window.openDayPicker=function(ds){
  const[y,m,d]=ds.split('-').map(Number);
  const days=['일','월','화','수','목','금','토'];
  const dt=new Date(y,m-1,d);
  const dc=dt.getDay()===0?'#ff6b6b':dt.getDay()===6?'#4d96ff':'var(--text)';
  const picker=document.getElementById('dayPicker');
  document.getElementById('dayPickerTitle').innerHTML=
    `<span style="color:${dc}">${m}월 ${d}일 ${days[dt.getDay()]}요일</span>`;
  document.getElementById('dayPickerMembers').innerHTML=members.map(mem=>{
    const ach=calcAch(mem.id,ds);
    let stat='기록 없음';
    if(ach.type==='rest') stat='😌 휴무';
    else if(ach.type==='special') stat='🎁 특휴';
    else if(ach.type==='progress') stat=`${ach.achieved}/${ach.total} 달성`;
    return`<button onclick="window.closeDayPicker();window.openPlan('${mem.id}','${ds}')"
      style="display:flex;align-items:center;gap:.6rem;width:100%;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;cursor:pointer;text-align:left;transition:border-color .15s"
      onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
      <span style="font-size:1.3rem">${mem.emoji}</span>
      <span style="flex:1;font-size:.9rem;font-weight:600;color:var(--text)">${mem.name}</span>
      <span style="font-size:.75rem;color:var(--muted)">${stat}</span>
    </button>`;
  }).join('');
  picker.classList.add('show');
};
window.closeDayPicker=function(){document.getElementById('dayPicker').classList.remove('show');};

function renderChips(){
  document.getElementById('memberChips').innerHTML=
    members.map(m=>`<div class="member-chip" onclick="window.openPlan('${m.id}')">
      <span class="member-emoji">${m.emoji}</span><span>${m.name}</span>
      <span onclick="event.stopPropagation();window.removeMember('${m.id}')"
        style="font-size:.6rem;color:var(--muted);opacity:.5;margin-left:3px;padding:2px 3px;border-radius:3px;cursor:pointer"
        onmouseover="this.style.opacity=1;this.style.color='#ff6b6b'"
        onmouseout="this.style.opacity=.5;this.style.color='var(--muted)'">✕</span>
    </div>`).join('')+
    `<div class="member-chip" onclick="window.toggleAddForm()"
      style="border-style:dashed;color:var(--muted);border-color:var(--muted)">
      <span style="font-size:1.1rem">＋</span><span>추가</span>
    </div>`;
}

// ── 멤버 추가/삭제 ──
window.removeMember=function(id){
  if(members.length<=1)return;
  members=members.filter(m=>m.id!==id);
  persistMembers();
  renderChips();
  Object.values(unsubPlans).forEach(u=>u());
  unsubPlans={};plansByMember={};
  subscribePlans();
};

window.toggleAddForm=function(){
  const f=document.getElementById('addMemberForm');
  f.style.display=f.style.display==='none'?'flex':'none';
  if(f.style.display==='flex') document.getElementById('newName').focus();
};

window.submitAddMember=function(){
  const name=document.getElementById('newName').value.trim();
  const emoji=document.getElementById('newEmoji').value.trim()||'👤';
  if(!name)return;
  const id='m'+Date.now();
  members.push({id,name,emoji});
  persistMembers();
  document.getElementById('newName').value='';
  document.getElementById('newEmoji').value='';
  document.getElementById('addMemberForm').style.display='none';
  renderChips();
  // 새 멤버 플랜 구독 추가
  const mem=members.find(m=>m.id===id);
  unsubPlans[id]=onSnapshot(doc(db,'miraclemorning',pdocId(id,curYear,curMonth)),snap=>{
    plansByMember[id]=snap.exists()?snap.data():{};
    renderCalendar();
  },()=>{});
  renderCalendar();
};

function subscribePlans(){
  members.forEach(mem=>{
    if(unsubPlans[mem.id])unsubPlans[mem.id]();
    unsubPlans[mem.id]=onSnapshot(doc(db,'miraclemorning',pdocId(mem.id,curYear,curMonth)),snap=>{
      plansByMember[mem.id]=snap.exists()?snap.data():{};
      renderCalendar();
      if(openMemberId===mem.id&&document.getElementById('planOverlay').classList.contains('show'))renderPlanBody();
      document.getElementById('loading').classList.add('hidden');
      setSyncDot(true);
    },err=>{
      console.error('Firestore error:',err);
      document.getElementById('loading').classList.add('hidden');
      setSyncDot(false);
    });
  });
}

function renderCalendar(){
  const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent=`${curYear}년 ${mn[curMonth]}`;
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  const fd=new Date(curYear,curMonth,1).getDay();
  const dim=new Date(curYear,curMonth+1,0).getDate();
  for(let i=0;i<fd;i++){const c=document.createElement('div');c.className='cal-cell empty';grid.appendChild(c);}
  for(let d=1;d<=dim;d++){
    const dow=new Date(curYear,curMonth,d).getDay();
    const isTod=curYear===todayY&&curMonth===todayM&&d===todayD;
    const hol=getHol(curYear,curMonth,d);
    const ds=dStr(curYear,curMonth,d);
    const cell=document.createElement('div');
    let cls='cal-cell';
    if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';if(isTod)cls+=' today';if(hol)cls+=' holiday-day';
    cell.className=cls;
    const top=document.createElement('div');top.className='day-top';
    top.innerHTML=`<span class="day-num">${d}</span>${hol?`<span class="day-hol">${hol}</span>`:''}`;
    cell.appendChild(top);
    const mems=document.createElement('div');mems.className='cal-members';
    members.forEach(mem=>{
      const ach=calcAch(mem.id,ds);
      if(ach.type==='empty')return;
      const row=document.createElement('div');row.className='cal-mem-row';
      let stat='';
      if(ach.type==='rest') stat=`<span class="cal-mem-stat s-rest">휴</span>`;
      else if(ach.type==='special') stat=`<span class="cal-mem-stat s-spec">특</span>`;
      else{const pct=ach.achieved/ach.total;stat=`<span class="cal-mem-stat" style="color:${pct>=1?'#00e5a0':'#ffd93d'}">${ach.achieved}/${ach.total}</span>`;}
      row.innerHTML=`<span class="cal-mem-emoji">${mem.emoji}</span>${stat}`;
      mems.appendChild(row);
    });
    cell.appendChild(mems);
    cell.addEventListener('click',()=>window.openDayPicker(ds));
    grid.appendChild(cell);
  }
}

window.openPlan=function(mid, dateStr){
  openMemberId=mid;
  planDateStr=dateStr||todayStr();
  const isToday=planDateStr===todayStr();

  // 오늘 플랜이 비어있으면 어제 항목 자동 이월
  if(isToday){
    const todayPlan=getPlan(mid,planDateStr);
    if(todayPlan.items.length===0&&!todayPlan.isRest&&!todayPlan.isSpecialRest){
      const yd=new Date();yd.setDate(yd.getDate()-1);
      const yds=dStr(yd.getFullYear(),yd.getMonth(),yd.getDate());
      const yPlan=getPlan(mid,yds);
      if(yPlan.items.length>0){
        const carried={
          items:yPlan.items.map(it=>({...it,id:genId(),done:false,fail:false})),
          isRest:false,isSpecialRest:false
        };
        savePlan(mid,planDateStr,carried);
      }
    }
  }

  const mem=members.find(m=>m.id===mid);
  const[y,m,d]=planDateStr.split('-').map(Number);
  const days=['일','월','화','수','목','금','토'];const dt=new Date(y,m-1,d);
  const dc=dt.getDay()===0?'#ff6b6b':dt.getDay()===6?'#4d96ff':'var(--muted)';
  document.getElementById('planMemLbl').innerHTML=`<span>${mem.emoji}</span><span>${mem.name}의 할 일</span>`;
  document.getElementById('planDateLbl').innerHTML=`<span style="color:var(--text)">${m}월 ${d}일</span> <span style="color:${dc}">${days[dt.getDay()]}요일</span>`;
  document.getElementById('planOverlay').classList.add('show');
  renderPlanBody();
};

window.closePlan=function(){document.getElementById('planOverlay').classList.remove('show');openMemberId=null;};

window.setItemWeight=function(id){
  if(!openMemberId)return;
  const today=planDateStr;
  const dp=JSON.parse(JSON.stringify(getPlan(openMemberId,today)));
  const it=dp.items.find(i=>i.id===id);if(!it)return;
  it.weight=((it.weight||1)%3)+1;
  savePlan(openMemberId,today,dp);renderPlanBody();

window.toggleRest=function(field){
  if(!openMemberId)return;
  const today=planDateStr,dp=JSON.parse(JSON.stringify(getPlan(openMemberId,today)));
  dp[field]=!dp[field];
  if(field==='isRest'&&dp.isRest)dp.isSpecialRest=false;
  if(field==='isSpecialRest'&&dp.isSpecialRest)dp.isRest=false;
  savePlan(openMemberId,today,dp);renderPlanBody();
};

window.togglePlanItem=function(id){
  if(!openMemberId)return;
  const today=planDateStr,dp=JSON.parse(JSON.stringify(getPlan(openMemberId,today)));
  const it=dp.items.find(i=>i.id===id);if(it){it.done=!it.done;if(it.done)it.fail=false;}
  savePlan(openMemberId,today,dp);renderPlanBody();
};

window.failPlanItem=function(id){
  if(!openMemberId)return;
  const today=planDateStr,dp=JSON.parse(JSON.stringify(getPlan(openMemberId,today)));
  const it=dp.items.find(i=>i.id===id);if(it){it.fail=!it.fail;if(it.fail)it.done=false;}
  savePlan(openMemberId,today,dp);renderPlanBody();
};

window.handlePaste=function(e){
  const text=e.clipboardData?.getData('text')||'';
  const lines=text.split(String.fromCharCode(10)).map(function(l){return l.split(String.fromCharCode(13)).join('').trim();}).filter(function(l){return l.length>0;});
  if(lines.length<=1)return;
  e.preventDefault();
  if(!openMemberId)return;
  const today=planDateStr,dp=JSON.parse(JSON.stringify(getPlan(openMemberId,today)));
  lines.forEach(function(name){dp.items.push({id:genId(),name:name,done:false});});
  document.getElementById('planItemInp').value='';
  savePlan(openMemberId,today,dp);renderPlanBody();
};

window.addPlanItem=function(){
  if(!openMemberId)return;
  const inp=document.getElementById('planItemInp'),name=inp?.value.trim();if(!name)return;
  const today=planDateStr,dp=JSON.parse(JSON.stringify(getPlan(openMemberId,today)));
  dp.items.push({id:genId(),name,done:false});inp.value='';
  savePlan(openMemberId,today,dp);renderPlanBody();
};

  const cancelBtn=document.createElement('button');
  cancelBtn.textContent='✕';
  cancelBtn.style.cssText='background:none;border:1px solid var(--muted);border-radius:5px;color:var(--muted);font-size:.8rem;padding:2px 6px;cursor:pointer;flex-shrink:0';

  wrap.appendChild(inp);
  wrap.appendChild(saveBtn);
  wrap.appendChild(cancelBtn);
  textDiv.innerHTML='';
  textDiv.appendChild(wrap);

  // 입력창 클릭이 행의 체크/드래그로 버블링되지 않도록 차단
  inp.addEventListener('pointerdown',e=>e.stopPropagation());
  inp.addEventListener('click',e=>e.stopPropagation());
  wrap.addEventListener('pointerdown',e=>e.stopPropagation());

  // 커서를 텍스트 끝으로 (전체 선택 X)
  setTimeout(()=>{
    inp.focus();
    const len=inp.value.length;
    inp.setSelectionRange(len,len);
  },50);

  const save=()=>{
    const newName=inp.value.trim();
    if(newName&&newName!==it.name){
      it.name=newName;it.edited=true;
      savePlan(openMemberId,today,dp);
    } else {
      renderPlanBody();
    }
  };
  const cancel=()=>renderPlanBody();

  saveBtn.addEventListener('pointerdown',e=>{e.preventDefault();save();});
  cancelBtn.addEventListener('pointerdown',e=>{e.preventDefault();cancel();});
  saveBtn.addEventListener('click',e=>{e.stopPropagation();save();});
  cancelBtn.addEventListener('click',e=>{e.stopPropagation();cancel();});
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();save();}
    if(e.key==='Escape'){cancel();}
  });
};

window.delPlanItem=function(id){
  if(!openMemberId)return;
  const today=planDateStr,dp=JSON.parse(JSON.stringify(getPlan(openMemberId,today)));
  dp.items=dp.items.filter(i=>i.id!==id);savePlan(openMemberId,today,dp);renderPlanBody();
};

window.capturePlan=function(){
  const card=document.getElementById('planCard');
  if(!card||typeof html2canvas==='undefined')return;
  const clone=card.cloneNode(true);
  const cloneBtns=clone.querySelector('.plan-hdr').querySelector('div:last-child');
  if(cloneBtns)cloneBtns.style.display='none';
  // absolute 포지셔닝으로 뷰포트 높이 제약 없이 전체 렌더링
  const wrap=document.createElement('div');
  wrap.style.cssText='position:absolute;left:-9999px;top:0;width:'+card.offsetWidth+'px;overflow:visible;pointer-events:none';
  clone.style.cssText='max-height:none;height:auto;border-radius:0;overflow:visible;width:100%';
  const cloneBody=clone.querySelector('#planBody');
  if(cloneBody){cloneBody.style.cssText+='max-height:none;overflow:visible;flex:none';}
  wrap.appendChild(clone);
  document.body.appendChild(wrap);
  setTimeout(()=>{
    html2canvas(clone,{backgroundColor:'#0e1320',scale:2,useCORS:true,width:wrap.offsetWidth,height:clone.scrollHeight}).then(async canvas=>{
      document.body.removeChild(wrap);
      const fileName=`할일_${todayStr()}.png`;

      // 모바일 여부 확인
      const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if(isMobile&&navigator.share){
        // 모바일: 공유 시트
        try{
          const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
          const file=new File([blob],fileName,{type:'image/png'});
          await navigator.share({files:[file],title:'오늘 할 일'});
          return;
        }catch(e){
          if(e.name==='AbortError')return;
          // 공유 실패 시 이미지 오버레이로 fallback
        }
      }

      if(isMobile){
        // 모바일 공유 실패: 꾹 눌러 저장 오버레이
        const overlay=document.createElement('div');
        overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px';
        const hint=document.createElement('div');
        hint.textContent='이미지를 꾹 눌러서 저장하세요';
        hint.style.cssText='color:#ffd93d;font-size:.85rem;font-weight:700;font-family:\'Noto Sans KR\',sans-serif';
        const img=document.createElement('img');
        img.src=canvas.toDataURL('image/png');
        img.style.cssText='max-width:100%;max-height:80vh;border-radius:12px';
        const closeBtn=document.createElement('button');
        closeBtn.textContent='닫기';
        closeBtn.style.cssText='background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:8px 24px;font-size:.85rem;cursor:pointer;font-family:\'Noto Sans KR\',sans-serif';
        closeBtn.addEventListener('click',()=>document.body.removeChild(overlay));
        overlay.addEventListener('click',e=>{if(e.target===overlay)document.body.removeChild(overlay);});
        overlay.appendChild(hint);overlay.appendChild(img);overlay.appendChild(closeBtn);
        document.body.appendChild(overlay);
      } else {
        // PC: 바로 다운로드
        const a=document.createElement('a');
        a.download=fileName;
        a.href=canvas.toDataURL('image/png');
        a.click();
      }
    }).catch(()=>{try{document.body.removeChild(wrap);}catch(e){}});
  },150);
};

function initPlanDrag(){
  const list=document.getElementById('planItemList');if(!list)return;
  list.querySelectorAll('.plan-item-row').forEach(row=>{
    const ck=row.querySelector('[data-check]');
    const fk=row.querySelector('[data-fail]');
    const dk=row.querySelector('[data-del]');
    const ek=row.querySelector('[data-edit]');
    const wk=row.querySelector('[data-weight]');

    // 버튼마다 click 이벤트 직접 등록 (드래그 시스템과 분리)
    if(fk) fk.addEventListener('click',e=>{e.stopPropagation();window.failPlanItem(fk.dataset.fail);});
    if(dk) dk.addEventListener('click',e=>{e.stopPropagation();window.delPlanItem(dk.dataset.del);});
    if(ek) ek.addEventListener('click',e=>{e.stopPropagation();window.editPlanItem(ek.dataset.edit);});
    if(wk) wk.addEventListener('click',e=>{e.stopPropagation();window.setItemWeight(wk.dataset.weight);});

    // 드래그/체크는 버튼 바깥 영역에서만
    row.addEventListener('pointerdown',e=>{
      if(e.target.closest('button'))return;
      let t=setTimeout(()=>{t=null;startDrag(e,row,list);},150);
      const up=()=>{
        row.removeEventListener('pointerup',up);
        row.removeEventListener('pointermove',mv);
        if(t!==null){clearTimeout(t);window.togglePlanItem(ck.dataset.check);}
      };
      const mv=(ev)=>{
        if((Math.abs(ev.clientX-e.clientX)>6||Math.abs(ev.clientY-e.clientY)>6)&&t!==null){
          clearTimeout(t);t=null;
          row.removeEventListener('pointerup',up);row.removeEventListener('pointermove',mv);
          startDrag(e,row,list);
        }
      };
      row.addEventListener('pointerup',up);row.addEventListener('pointermove',mv);
    });
  });
}

function startDrag(e,row,list){
  e.preventDefault();
  const rows=Array.from(list.querySelectorAll('.plan-item-row')),rH=row.getBoundingClientRect().height+4;
  Object.assign(row.style,{position:'relative',zIndex:'50',boxShadow:'0 6px 16px rgba(0,0,0,.5)',transform:'scale(1.02)',transition:'none',cursor:'grabbing'});
  const others=rows.filter(r=>r!==row);others.forEach(r=>r.style.transition='transform .15s');
  function onMv(ev){
    const off=ev.clientY-e.clientY;row.style.transform=`translateY(${off}px) scale(1.02)`;
    const mi=rows.indexOf(row);
    others.forEach(r=>{const idx=rows.indexOf(r);let sh=0;if(off>0&&idx>mi&&off>(idx-mi-.5)*rH)sh=-rH;if(off<0&&idx<mi&&off<-(mi-idx-.5)*rH)sh=rH;r.style.transform=`translateY(${sh}px)`;r.dataset.sh=sh;});
  }
  function onUp(){
    document.removeEventListener('pointermove',onMv);document.removeEventListener('pointerup',onUp);
    const mi=rows.indexOf(row);let ti=mi;
    others.forEach(r=>{if(r.dataset.sh&&r.dataset.sh!=='0'){const idx=rows.indexOf(r);ti=Number(r.dataset.sh)<0?Math.max(ti,idx):Math.min(ti===mi?idx:ti,idx);}});
    Object.assign(row.style,{position:'',zIndex:'',boxShadow:'',transform:'',transition:''});
    others.forEach(r=>{r.style.transform='';r.style.transition='';delete r.dataset.sh;});
    if(ti!==mi&&openMemberId){
      const today=planDateStr,dp=JSON.parse(JSON.stringify(getPlan(openMemberId,today)));
      const fi=dp.items.findIndex(i=>i.id===rows[mi].dataset.id);
      if(fi>=0){const[item]=dp.items.splice(fi,1);dp.items.splice(Math.max(0,Math.min(dp.items.length,ti)),0,item);savePlan(openMemberId,today,dp);}
    }
    renderPlanBody();
  }
  document.addEventListener('pointermove',onMv);document.addEventListener('pointerup',onUp);
}

document.getElementById('prevBtn').addEventListener('click',()=>{
  curMonth--;if(curMonth<0){curMonth=11;curYear--;}
  Object.values(unsubPlans).forEach(u=>u());unsubPlans={};plansByMember={};subscribePlans();
});
document.getElementById('nextBtn').addEventListener('click',()=>{
  curMonth++;if(curMonth>11){curMonth=0;curYear++;}
  Object.values(unsubPlans).forEach(u=>u());unsubPlans={};plansByMember={};subscribePlans();
});

renderChips();
subscribePlans();
setTimeout(()=>document.getElementById('loading').classList.add('hidden'),3000);
</script>
