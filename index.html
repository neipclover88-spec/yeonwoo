<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미라클모닝 출석</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1a;--surface:#141726;--surface2:#1c2035;--border:#2a2f4a;--accent:#00e5a0;--accent2:#4d96ff;--accent3:#ffd93d;--danger:#ff6b6b;--warn:#fbbf24;--text:#e8eaf0;--muted:#5a6080}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{position:sticky;top:0;z-index:100;background:rgba(13,15,26,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0.7rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:0.8rem;flex-wrap:wrap}
.nav-title{font-size:0.95rem;font-weight:700;display:flex;align-items:center;gap:0.5rem}
.nav-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.nav-month{display:flex;align-items:center;gap:0.5rem}
.month-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:1rem;transition:all 0.15s;display:flex;align-items:center;justify-content:center;font-family:inherit}
.month-btn:hover{border-color:var(--accent);color:var(--accent)}
.month-label{font-family:'DM Mono',monospace;font-size:0.85rem;color:var(--accent);min-width:90px;text-align:center}
.sync-badge{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--accent);background:rgba(0,229,160,0.1);border:1px solid rgba(0,229,160,0.2);padding:0.18rem 0.6rem;border-radius:100px}
.sync-badge.err{color:var(--danger);background:rgba(255,107,107,0.1);border-color:rgba(255,107,107,0.2)}
.loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.4s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:0.8rem}
.loading-txt{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.admin-toggle{font-size:0.72rem;padding:0.2rem 0.7rem;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
.admin-toggle.on{color:var(--accent3);background:rgba(255,217,61,0.1);border-color:rgba(255,217,61,0.3)}
.main{max-width:680px;margin:0 auto;padding:1.2rem 1rem}
.name-section{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.2rem;margin-bottom:1.2rem}
.section-label-mono{font-family:'DM Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);margin-bottom:0.7rem}
.name-grid{display:flex;flex-wrap:wrap;gap:0.45rem}
.name-chip{display:flex;align-items:center;gap:0.4rem;padding:0.38rem 0.75rem;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:0.78rem;font-weight:500;transition:all 0.15s;user-select:none;white-space:nowrap}
.name-chip:hover{border-color:#444b70;transform:translateY(-1px)}
.name-chip.selected{border-color:var(--accent);background:rgba(0,229,160,0.1);color:var(--accent);font-weight:700;box-shadow:0 0 0 1px rgba(0,229,160,0.2)}
.chip-emoji{font-size:1rem;line-height:1}
.selected-info{margin-top:0.7rem;padding-top:0.7rem;border-top:1px solid var(--border);font-size:0.75rem;color:var(--muted);display:none;align-items:center;gap:0.5rem}
.selected-info.show{display:flex}
.selected-info strong{color:var(--accent)}
.calendar-section{margin-bottom:1.2rem}
.cal-top{display:flex;align-items:center;flex-wrap:wrap;gap:0.6rem;margin-bottom:0.7rem}
.cal-top-label{font-family:'DM Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted)}
.cal-guide{font-size:0.78rem;font-weight:700;color:var(--accent);background:rgba(0,229,160,0.1);border:1px solid rgba(0,229,160,0.3);padding:0.22rem 0.8rem;border-radius:100px;white-space:nowrap}
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.weekday{text-align:center;font-size:0.65rem;font-family:'DM Mono',monospace;color:var(--muted);padding:0.2rem}
.weekday.sun{color:#ff6b6b88}.weekday.sat{color:#4d96ff88}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.4rem 0.3rem 0.5rem;cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:3px;height:88px;overflow:hidden}
.cal-cell:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,229,160,0.1)}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cal-cell.today{border-color:var(--accent)}
.cal-cell.today .cal-day{color:var(--accent)}
.cal-cell.sun .cal-day{color:#ff6b6b}
.cal-cell.sat .cal-day{color:var(--accent2)}
.cal-cell.holiday-day .cal-day{color:#ff6b6b}
.cal-day-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:2px}
.cal-day{font-size:0.82rem;font-weight:700;line-height:1;flex-shrink:0}
.cal-holiday{font-size:0.42rem;color:#ff6b6b88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left;line-height:1}
.cal-emojis{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:2px}
.cal-em{font-size:0.95rem;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;background:var(--surface2)}
.cal-em::after{content:'';position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--bg);font-size:6px;display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1}
.cal-em.pass::after{background:var(--accent);content:'✓';color:#0d0f1a;font-size:6.5px}
.cal-em.under::after{background:var(--warn);content:'!';color:#0d0f1a;font-size:7px}
.cal-em.absent::after{background:var(--danger);content:'✕';color:#fff;font-size:6px}
.cal-em.holiday::after{background:var(--muted);content:'휴';color:#fff;font-size:5px}
.cal-em.none{display:none}
.legend{display:flex;gap:0.8rem;flex-wrap:wrap;margin-bottom:1.2rem}
.leg-item{display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.leg-dot.pass{background:rgba(0,229,160,0.4)}.leg-dot.under{background:rgba(251,191,36,0.4)}
.leg-dot.absent{background:rgba(255,107,107,0.4)}.leg-dot.holiday{background:rgba(90,96,128,0.4)}
.day-panel{display:none}
.status-popup{position:fixed;z-index:200;background:#1c2035;border:1px solid var(--accent);border-radius:12px;padding:0.75rem;box-shadow:0 8px 32px rgba(0,0,0,0.5);min-width:180px}
.status-popup-title{font-size:0.72rem;color:var(--accent3);font-weight:700;margin-bottom:8px}
.status-popup-btns{display:flex;flex-direction:column;gap:5px}
.sp-btn{font-size:0.8rem;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;text-align:left;transition:all 0.12s}
.sp-btn:hover{border-color:#444b70;color:var(--text)}
.sp-btn.pass.active,.sp-btn.pass:hover{background:rgba(0,229,160,0.15);color:var(--accent);border-color:rgba(0,229,160,0.4)}
.sp-btn.under.active,.sp-btn.under:hover{background:rgba(251,191,36,0.15);color:var(--warn);border-color:rgba(251,191,36,0.4)}
.sp-btn.absent.active,.sp-btn.absent:hover{background:rgba(255,107,107,0.15);color:var(--danger);border-color:rgba(255,107,107,0.4)}
.sp-btn.holiday.active,.sp-btn.holiday:hover{background:rgba(90,96,128,0.25);color:#aaa;border-color:#444}
.sp-btn.clear.active,.sp-btn.clear:hover{background:var(--surface2);color:var(--text);border-color:var(--border)}
.day-panel-title{font-size:0.8rem;font-weight:700;margin-bottom:10px;color:var(--accent3)}
.day-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)}
.day-row:last-child{border-bottom:none}
.day-row-name{font-size:0.78rem;display:flex;align-items:center;gap:6px}
.status-btns{display:flex;gap:4px}
.s-btn{font-size:0.65rem;padding:3px 7px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.12s}
.s-btn:hover{border-color:#444b70}
.s-btn.pass.active{background:rgba(0,229,160,0.18);color:var(--accent);border-color:rgba(0,229,160,0.4)}
.s-btn.under.active{background:rgba(251,191,36,0.18);color:var(--warn);border-color:rgba(251,191,36,0.4)}
.s-btn.absent.active{background:rgba(255,107,107,0.18);color:var(--danger);border-color:rgba(255,107,107,0.4)}
.s-btn.holiday.active{background:rgba(90,96,128,0.25);color:var(--muted);border-color:#444}
.s-btn.clear.active{background:var(--surface2);color:var(--text);border-color:var(--border)}
.members-section{margin-bottom:1.2rem}
.members-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem}
.members-title{font-size:0.95rem;font-weight:700}
.add-member-btn{font-size:0.72rem;padding:0.25rem 0.75rem;border-radius:100px;border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
.add-member-btn:hover{border-color:var(--accent);color:var(--accent)}
.add-form{display:flex;gap:8px;margin-bottom:0.8rem;align-items:center}
.add-input{flex:1;font-size:0.8rem;padding:0.4rem 0.75rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Noto Sans KR',sans-serif;outline:none}
.add-input:focus{border-color:var(--accent)}
.add-ok{font-size:0.75rem;padding:0.38rem 0.9rem;border-radius:8px;background:rgba(0,229,160,0.15);color:var(--accent);border:1px solid rgba(0,229,160,0.3);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700}
.add-cancel{font-size:0.75rem;padding:0.38rem 0.7rem;border-radius:8px;background:transparent;color:var(--muted);border:1px solid var(--border);cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.member-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.member-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.875rem;transition:border-color 0.15s}
.member-card.left-card{opacity:0.45}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.card-name-wrap{display:flex;align-items:center;gap:7px}
.card-avatar{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.card-name{font-size:0.78rem;font-weight:700;line-height:1.3}
.left-badge{font-size:0.6rem;color:var(--danger);display:block;margin-top:2px}
.leave-btn{font-size:0.65rem;padding:0.18rem 0.55rem;border-radius:6px;background:transparent;color:var(--danger);border:1px solid rgba(255,107,107,0.3);cursor:pointer;font-family:'Noto Sans KR',sans-serif;flex-shrink:0}
.card-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stat-box{background:var(--surface2);border-radius:7px;padding:5px 7px}
.stat-lbl{font-size:0.6rem;color:var(--muted);margin-bottom:1px}
.stat-val{font-size:0.88rem;font-weight:700;color:var(--text)}
.stat-val.green{color:var(--accent)}.stat-val.red{color:var(--danger)}.stat-val.warn{color:var(--warn)}
.confirm-strip{background:rgba(255,107,107,0.08);border:1px solid rgba(255,107,107,0.2);border-radius:8px;padding:6px 8px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.confirm-txt{font-size:0.7rem;color:var(--danger)}
.confirm-btns{display:flex;gap:5px}
.cok{font-size:0.65rem;padding:2px 9px;border-radius:6px;background:var(--danger);color:#111;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700}
.ccancel{font-size:0.65rem;padding:2px 8px;border-radius:6px;background:transparent;color:var(--muted);border:1px solid var(--border);cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.fine-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.875rem 1rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
.fine-lbl{font-size:0.8rem;color:var(--muted)}
.fine-sub{font-size:0.65rem;color:var(--muted);opacity:0.6;margin-top:2px}
.fine-val{font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:500;color:var(--danger)}
.fine-val.zero{color:var(--muted);font-size:0.9rem}
@media(max-width:480px){.main{padding:0.9rem 0.75rem}.cal-em{font-size:0.55rem}.cal-em-name{display:none}.cal-em-badge{font-size:0.55rem}}

/* 멤버 설정 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.hidden{display:none}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;padding:1.2rem 1rem 2rem}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 1.2rem}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:0.3rem}
.modal-sub{font-size:0.75rem;color:var(--muted);margin-bottom:1.2rem}
.member-edit-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.member-edit-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:0.6rem 0.75rem}
.emoji-btn{font-size:1.3rem;background:none;border:none;cursor:pointer;width:32px;text-align:center;flex-shrink:0}
.member-name-input{flex:1;font-size:0.85rem;background:transparent;border:none;color:var(--text);font-family:'Noto Sans KR',sans-serif;outline:none;min-width:0}
.member-name-input::placeholder{color:var(--muted)}
.del-btn{font-size:0.7rem;padding:3px 8px;border-radius:6px;background:transparent;color:var(--danger);border:1px solid rgba(255,107,107,0.25);cursor:pointer;font-family:'Noto Sans KR',sans-serif;flex-shrink:0}
.del-btn:hover{background:rgba(255,107,107,0.1)}
.modal-add-btn{width:100%;padding:0.6rem;border-radius:10px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:0.82rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-bottom:1.2rem;transition:all 0.15s}
.modal-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.modal-save-btn{width:100%;padding:0.75rem;border-radius:12px;border:none;background:var(--accent);color:#0d0f1a;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.setup-btn{font-size:0.72rem;padding:0.2rem 0.7rem;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
.setup-btn:hover{border-color:var(--accent);color:var(--accent)}
.emoji-picker{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px;margin:-4px 0 8px}
.ep-btn{font-size:1.1rem;background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.ep-btn:hover,.ep-btn.sel{border-color:var(--accent);background:rgba(0,229,160,0.1)}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-txt">불러오는 중...</div>
</div>
<nav class="nav">
  <div class="nav-title"><span class="nav-dot"></span>미라클모닝</div>
  <div class="nav-month">
    <button class="month-btn" id="prevBtn">‹</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="month-btn" id="nextBtn">›</button>
  </div>
  <div style="display:flex;align-items:center;gap:0.5rem">
    <button class="setup-btn" id="setupBtn">⚙ 멤버 설정</button>
    <button class="admin-toggle" id="adminToggle">관리자</button>
    <span class="sync-badge" id="syncBadge">연결 중...</span>
  </div>
</nav>

<!-- 멤버 설정 모달 -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">멤버 설정</div>
    <div class="modal-sub">이름을 클릭해서 수정하거나 이모지를 눌러 변경할 수 있어요</div>
    <div class="member-edit-list" id="memberEditList"></div>
    <button class="modal-add-btn" id="modalAddBtn">+ 멤버 추가</button>
    <button class="modal-save-btn" id="modalSaveBtn">저장하기</button>
  </div>
</div>

<div class="main">
  <div class="name-section">
    <div class="section-label-mono">👤 내 이름 선택</div>
    <div class="name-grid" id="nameGrid"></div>
    <div class="selected-info" id="selectedInfo">
      <span>선택됨:</span>
      <strong id="selectedInfoText"></strong>
      <span style="color:var(--muted)">— 달력 날짜를 클릭하면 바로 체크돼요</span>
    </div>
  </div>

  <div class="calendar-section">
    <div class="cal-top">
      <span class="cal-top-label" id="calTopLabel"></span>
      <span class="cal-guide">👆 닉네임 선택 후 날짜 클릭 = 자동 인증체크!</span>
    </div>
    <div class="weekday-row">
      <div class="weekday sun">일</div><div class="weekday">월</div><div class="weekday">화</div>
      <div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday sat">토</div>
    </div>
    <div class="calendar-grid" id="calGrid"></div>
  </div>

  <div class="legend">
    <div class="leg-item"><div class="leg-dot pass"></div>인증</div>
    <div class="leg-item"><div class="leg-dot under"></div>미달 (-1,000원)</div>
    <div class="leg-item"><div class="leg-dot absent"></div>결석 (-3,000원)</div>
    <div class="leg-item"><div class="leg-dot holiday"></div>휴일 사용</div>
  </div>


  <div class="members-section">
    <div class="members-header">
      <span class="members-title">멤버 현황</span>
      <button class="add-member-btn" id="addMemberBtn" style="display:none">+ 멤버 추가</button>
    </div>
    <div id="addForm" style="display:none">
      <div class="add-form">
        <input class="add-input" id="newMemberName" type="text" placeholder="닉네임 입력 (예: 연우(경한))">
        <button class="add-ok" id="addOkBtn">추가</button>
        <button class="add-cancel" id="addCancelBtn">취소</button>
      </div>
    </div>
    <div class="member-grid" id="memberGrid"></div>
  </div>

  <div class="fine-bar">
    <div>
      <div class="fine-lbl">이번 달 벌금 풀</div>
      <div class="fine-sub" id="depositInfo"></div>
      <div class="fine-sub">탈퇴 멤버 분배 제외</div>
    </div>
    <div class="fine-val" id="totalFine">0원</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

function getHoliday(y,m,d){return HOLIDAYS[String(y)]?.[String(m)]?.[d]||null;}

const DEPOSIT=5000;

let members=[], monthData={};

function mKey(id){return `m${id}`;}
function docId(y,m){return `mm_${y}_${String(m).padStart(2,'0')}`;}
function getStatus(d,id){return monthData[`d${d}_${mKey(id)}`]||null;}
function memberById(id){return members.find(m=>m.id==id);}

function setSyncStatus(ok){
  const el=document.getElementById('syncBadge');
  el.textContent=ok?'● 실시간':'● 오류';
  el.classList.toggle('err',!ok);
}

// ── Firebase 구독 ─────────────────────────────────
function subscribeMembers(){
  onSnapshot(doc(db,'miraclemorning','_members'),(snap)=>{
    members=snap.exists()?(snap.data().members||[]):[];
    render();
    document.getElementById('loadingOverlay').classList.add('hidden');
    setSyncStatus(true);
  },(e)=>{setSyncStatus(false);document.getElementById('loadingOverlay').classList.add('hidden');});
}

function subscribeMonth(y,m){
  if(unsubMonth)unsubMonth();
  unsubMonth=onSnapshot(doc(db,'miraclemorning',docId(y,m)),(snap)=>{
    monthData=snap.exists()?snap.data():{};
    render();
  });
}

async function saveMembers(){
  await setDoc(doc(db,'miraclemorning','_members'),{members});
}

async function saveStatus(y,m,d,id,status){
  const r=doc(db,'miraclemorning',docId(y,m));
  const snap=await getDoc(r);
  const data=snap.exists()?snap.data():{};
  const key=`d${d}_${mKey(id)}`;
  if(status)data[key]=status;else delete data[key];
  await setDoc(r,data);
}

// ── 통계 ───────────────────────────────────────────
function calcStats(id){
  const dim=new Date(curYear,curMonth+1,0).getDate();
  let pass=0,under=0,absent=0,hol=0;
  for(let d=1;d<=dim;d++){
    const s=getStatus(d,id);
    if(s==='pass')pass++;else if(s==='under')under++;else if(s==='absent')absent++;else if(s==='holiday')hol++;
  }
  const filled=pass+under+absent+hol;
  const fine=under*1000+absent*3000;
  const rate=filled>0?Math.round((pass+hol)/filled*100):0;
  return{pass,under,absent,hol,fine,rate,balance:DEPOSIT-fine};
}

function calcDistribution(){
  const active=members.filter(m=>m.active);
  const totalFine=active.reduce((a,m)=>a+calcStats(m.id).fine,0);
  const totalRate=active.reduce((a,m)=>a+calcStats(m.id).rate,0);
  const dist={};
  active.forEach(m=>{const st=calcStats(m.id);dist[m.id]=totalRate>0?Math.round(totalFine*(st.rate/totalRate)):0;});
  const diff=totalFine-Object.values(dist).reduce((a,b)=>a+b,0);
  if(diff!==0&&active.length>0){const topId=active.reduce((a,b)=>calcStats(a.id).rate>=calcStats(b.id).rate?a:b).id;dist[topId]=(dist[topId]||0)+diff;}
  return{totalFine,dist};
}

// ── 렌더 ───────────────────────────────────────────
function render(){
  const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('monthLabel').textContent=`${curYear}년 ${mn[curMonth]}`;
  document.getElementById('calTopLabel').textContent=`${curYear}년 ${mn[curMonth]} 출석 달력`;
  renderNameGrid();renderCalendar();renderDayPanel();renderMemberGrid();renderFineBar();
}

function renderNameGrid(){
  const active=members.filter(m=>m.active);
  document.getElementById('nameGrid').innerHTML=active.map(m=>`
    <div style="display:flex;align-items:center;gap:3px">
      <div class="name-chip${m.id==myId?' selected':''}" onclick="selectMe(${m.id})"><span class="chip-emoji">${m.emoji}</span>${m.name}</div>
      ${m.id==myId?`<button onclick="window.openEmojiForMe()" style="background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:0.7rem;padding:3px 6px;color:var(--muted)">✏️</button>`:''}
    </div>
  `).join('');
  const me=memberById(parseInt(myId));
  const info=document.getElementById('selectedInfo');
  if(me&&me.active){info.classList.add('show');document.getElementById('selectedInfoText').textContent=`${me.emoji} ${me.name}`;}
  else info.classList.remove('show');
}

function renderCalendar(){
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  const fd=new Date(curYear,curMonth,1).getDay();
  const dim=new Date(curYear,curMonth+1,0).getDate();
  const active=members.filter(m=>m.active);
  for(let i=0;i<fd;i++){const c=document.createElement('div');c.className='cal-cell empty';grid.appendChild(c);}
  for(let d=1;d<=dim;d++){
    const dow=new Date(curYear,curMonth,d).getDay();
    const isTod=curYear===todayY&&curMonth===todayM&&d===todayD;
    const hol=getHoliday(curYear,curMonth,d);
    const cell=document.createElement('div');
    let cls='cal-cell';
    if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';if(isTod)cls+=' today';if(hol)cls+=' holiday-day';
    cell.className=cls;
    const emojis=active.map(m=>{const s=getStatus(d,m.id)||'none';return`<span class="cal-em ${s}" title="${m.name}">${m.emoji}</span>`;}).join('');
    cell.innerHTML=`<div class="cal-day-row">${hol?`<span class="cal-holiday">${hol}</span>`:''}<span class="cal-day">${d}</span></div><div class="cal-emojis">${emojis}</div>`;
    const dd=d;cell.addEventListener('click',(e)=>handleCalClick(dd,e));
    grid.appendChild(cell);
  }
}

function closePopup(){ document.querySelector('.status-popup')?.remove(); }

function showStatusPopup(day, rect){
  closePopup();
  const me = isAdmin ? null : memberById(parseInt(myId));
  const showMembers = isAdmin ? members.filter(m=>m.active) : (me ? [me] : []);
  if(!showMembers.length) return;

  const popup = document.createElement('div');
  popup.className = 'status-popup';

  // 팝업 위치 계산
  const top = rect.bottom + window.scrollY + 6;
  const left = Math.min(rect.left, window.innerWidth - 200);
  popup.style.top = top + 'px';
  popup.style.left = Math.max(8, left) + 'px';

  const STATUSES = [{k:null,l:'— 없음',c:'clear'},{k:'pass',l:'✓ 인증',c:'pass'},{k:'under',l:'! 미달',c:'under'},{k:'absent',l:'✕ 결석',c:'absent'},{k:'holiday',l:'휴 휴일',c:'holiday'}];

  popup.innerHTML = showMembers.map(m => {
    const cur = getStatus(day, m.id)||null;
    return `<div style="margin-bottom:${showMembers.length>1?'10px':'0'}">
      ${showMembers.length>1?`<div style="font-size:0.7rem;color:var(--muted);margin-bottom:5px">${m.emoji} ${m.name}</div>`:''}
      <div class="status-popup-title">${curMonth+1}월 ${day}일</div>
      <div class="status-popup-btns">${
        STATUSES.map(({k,l,c})=>`<button class="sp-btn ${c}${cur===k?' active':''}" onclick="window.popupSetStatus(${day},${m.id},'${k||''}')">${l}</button>`).join('')
      }</div>
    </div>`;
  }).join('');

  document.body.appendChild(popup);

  // 바깥 클릭시 닫기
  setTimeout(()=>{
    document.addEventListener('click', function handler(e){
      if(!popup.contains(e.target)){popup.remove();document.removeEventListener('click',handler);}
    });
  }, 10);
}

async function handleCalClick(day, e){
  e.stopPropagation();
  if(!myId && !isAdmin){alert('먼저 위에서 내 이름을 선택해주세요!');return;}
  const rect = e.currentTarget.getBoundingClientRect();
  selDay = day;
  showStatusPopup(day, rect);
}

window.popupSetStatus = async function(day, memberId, statusRaw){
  const status = statusRaw===''?null:statusRaw;
  await saveStatus(curYear, curMonth, day, memberId, status);
  closePopup();
};

function renderFineBar(){
  const {totalFine}=calcDistribution();
  const activeCount=members.filter(m=>m.active).length;
  const el=document.getElementById('totalFine');
  el.textContent=totalFine.toLocaleString()+'원';
  el.classList.toggle('zero',totalFine===0);
  document.getElementById('depositInfo').textContent=`총 예치금 ${(activeCount*DEPOSIT).toLocaleString()}원 (1인 ${DEPOSIT.toLocaleString()}원 × ${activeCount}명)`;
}

window.pickMyEmoji=async function(emoji){
  members=members.map(m=>m.id==myId?{...m,emoji}:m);
  await saveMembers();
  document.querySelector('.emoji-overlay')?.remove();
  render();
};

window.setStatus=async function(memberId,statusRaw){
  if(!selDay)return;
  await saveStatus(curYear,curMonth,selDay,memberId,statusRaw===''?null:statusRaw);
};

window.startLeave=function(id){confirmLeaveId=id;render();};
window.cancelLeave=function(){confirmLeaveId=null;render();};
window.confirmLeave=async function(id){
  members=members.map(m=>m.id===id?{...m,active:false}:m);
  await saveMembers();confirmLeaveId=null;

function renderEditList(){

      <div class="member-edit-row" id="erow_${i}">
        <button class="emoji-btn" onclick="window.toggleEmojiPicker(${i})">${m.emoji}</button>

      </div>

window.toggleEmojiPicker=function(i){

  const p=document.getElementById(`epicker_${i}`);p.style.display=p.style.display==='none'?'flex':'none';
};

window.editName=function(i,val){editMembers[i].name=val;};
window.deleteMember=function(i){editMembers.splice(i,1);renderEditList();};

document.getElementById('modalAddBtn').addEventListener('click',()=>{
  editMembers.push({id:Date.now(),name:'',emoji:EMOJIS[editMembers.length%EMOJIS.length],active:true});
  renderEditList();setTimeout(()=>{const inputs=document.querySelectorAll('.member-name-input');if(inputs.length)inputs[inputs.length-1].focus();},50);
});
document.getElementById('modalSaveBtn').addEventListener('click',async()=>{
  const valid=editMembers.filter(m=>m.name.trim());
  if(!valid.length){alert('멤버 이름을 하나 이상 입력해주세요');return;}
  members=valid.map(m=>({...m,name:m.name.trim(),active:m.active??true}));
  await saveMembers();myId='';localStorage.removeItem('mm_myid');closeSetup();
});
document.getElementById('setupBtn').addEventListener('click',openSetup);
document.getElementById('modalOverlay').addEventListener('click',(e)=>{if(e.target===document.getElementById('modalOverlay'))closeSetup();});

subscribeMonth(curYear,curMonth);
